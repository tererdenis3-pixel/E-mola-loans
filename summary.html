<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumo - e-mola</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="emola-logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="emola-logo.png" alt="e-Mola" style="height: 40px;">
            <button id="lang-btn" class="lang-btn">
                <img id="lang-flag" src="https://flagcdn.com/w40/gb.png" alt="Flag">
                <span id="lang-text">ENG</span>
            </button>
        </header>

        <div class="progress-container">
            <div class="progress-bar" style="width: 30%;"></div>
        </div>

        <main>
            <h1 class="page-title" data-t="summary">Resumo do Empréstimo</h1>
            <p class="page-subtitle" data-t="select_p">Confirme os valores antes de prosseguir com a sua candidatura.</p>

            <div class="elite-card">
                <div class="summary-list">
                    <div class="summary-item">
                        <span class="summary-key" data-t="receive">Valor a receber</span>
                        <strong class="summary-val" id="sum-receive">MZN 0.00</strong>
                    </div>
                    <div class="summary-item">
                        <span class="summary-key" data-t="period">Período</span>
                        <strong class="summary-val" id="sum-period">0 Meses</strong>
                    </div>
                    <div class="summary-item">
                        <span class="summary-key" data-t="fee">Taxa de serviço</span>
                        <strong class="summary-val" id="sum-fee">MZN 0.00</strong>
                    </div>
                    <div class="summary-item" style="border-top: 2px dashed var(--gray-100); margin-top: 10px; padding-top: 20px;">
                        <span class="summary-key" data-t="to_repay" style="color: var(--black);">Total a reembolsar</span>
                        <strong class="summary-val" id="sum-total" style="color: var(--brand-orange); font-size: 20px;">MZN 0.00</strong>
                    </div>
                </div>

                <div class="alert-box">
                    <i class="fa-solid fa-circle-info alert-icon"></i>
                    <p class="alert-text" data-t="penalty_note">Penalidades se não reembolsado a tempo. Reembolse sempre a tempo para proteger o seu limite.</p>
                </div>

                <div class="btn-group">
                    <button class="btn-elite btn-primary" onclick="navigateTo('details.html')">
                        <span data-t="confirm_proceed">CONFIRMAR E PROSSEGUIR</span>
                    </button>
                    <button class="btn-elite btn-secondary" onclick="navigateTo('index.html')">
                        <span data-t="back_btn">VOLTAR</span>
                    </button>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
