<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucesso - e-mola</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="emola-logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="emola-logo.png" alt="e-Mola" style="height: 40px;">
        </header>

        <div class="progress-container">
            <div class="progress-bar" style="width: 100%;"></div>
        </div>

        <main style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1;">
            <div style="width: 100px; height: 100px; background: var(--white); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 32px; box-shadow: var(--shadow-lg);">
                <i class="fa-solid fa-check" style="font-size: 48px; color: var(--success);"></i>
            </div>
            
            <h1 class="page-title" data-t="success_title">Solicitação Concluída!</h1>
            <p class="page-subtitle" data-t="success_msg" style="max-width: 300px; margin-bottom: 40px;">O seu pedido de empréstimo foi enviado com sucesso e está a ser processado.</p>

            <button class="btn-elite btn-primary" onclick="localStorage.clear(); window.location.href='index.html'" style="max-width: 200px;">
                <span>OK</span>
            </button>
        </main>

        <div class="security-badge" style="margin-top: 40px;">
            <i class="fa-solid fa-copyright"></i>
            <span>2026 e-mola Financial Services. All rights reserved.</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
